<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="registration-layout">
        <section class="registration-panel" aria-labelledby="form-title">
            <form id="registration-form" novalidate>
                <div class="w-full mt-4 max-w-7xl px-4 md:px-3 lg:px-4 mx-auto">
                    <h1 id="form-title" class="text-gray-900 text-xl font-semibold leading-loose">Registration Form</h1>

                    <div class="mt-6 space-y-6">
                        <div>
                            <label for="name" class="block text-gray-600 text-base font-medium mb-2">Name</label>
                            <input id="name" name="name" type="text" autocomplete="name" required
                                aria-describedby="name-error"
                                class="w-full text-gray-900 placeholder-gray-400 text-lg px-5 py-3 rounded-lg border border-gray-200"
                                placeholder="John">
                            <p id="name-error" class="field-message" aria-live="polite"></p>
                        </div>

                        <div>
                            <label for="email" class="block text-gray-600 text-base font-medium mb-2">Email</label>
                            <input id="email" name="email" type="email" autocomplete="email" required
                                aria-describedby="email-error"
                                class="w-full text-gray-900 placeholder-gray-400 text-lg px-5 py-3 rounded-lg border border-gray-200"
                                placeholder="john@example.com">
                            <p id="email-error" class="field-message" aria-live="polite"></p>
                        </div>

                        <div>
                            <label for="password" class="block text-gray-600 text-base font-medium mb-2">Password</label>
                            <input id="password" name="password" type="password" autocomplete="new-password" required
                                minlength="6" aria-describedby="password-error"
                                class="w-full text-gray-900 placeholder-gray-400 text-lg px-5 py-3 rounded-lg border border-gray-200"
                                placeholder="At least 6 characters">
                            <p id="password-error" class="field-message" aria-live="polite"></p>
                        </div>

                        <div>
                            <label for="bio" class="block text-gray-600 text-base font-medium mb-2">Bio</label>
                            <textarea id="bio" name="bio" maxlength="200" rows="4" aria-describedby="bio-counter bio-warning"
                                class="w-full text-gray-900 placeholder-gray-400 text-lg px-5 py-3 rounded-lg border border-gray-200"
                                placeholder="Tell us a little about yourself"></textarea>
                            <div class="bio-meta">
                                <span id="bio-counter" aria-live="polite">0 / 200 characters</span>
                                <span id="bio-warning" class="field-message" aria-live="polite"></span>
                            </div>
                        </div>

                        <button id="submit-button" type="submit" disabled
                            class="submit-button mt-2 w-full sm:w-auto px-9 py-3 bg-indigo-600 rounded-xl shadow">
                            <span class="px-3.5 text-center text-white text-lg font-semibold leading-8">Submit</span>
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <section class="registration-panel px-3" aria-labelledby="registrations-title">
            <h2 id="registrations-title" class="text-gray-900 text-sm font-semibold leading-loose m-4">
                Registration details
            </h2>
            <div class="registration-table-scroll relative bg-neutral-primary-soft shadow-xs rounded-base border border-default">
                <table class="registration-table min-w-max w-full text-sm text-left rtl:text-right text-body">
                    <thead class="bg-neutral-secondary-soft border-b border-default">
                        <tr>
                            <th scope="col" class="px-6 py-3 font-medium">Name</th>
                            <th scope="col" class="px-6 py-3 font-medium">Email</th>
                            <th scope="col" class="px-6 py-3 font-medium">Bio</th>
                            <th scope="col" class="px-6 py-3 font-medium">Remove</th>
                        </tr>
                    </thead>
                    <tbody id="table"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
